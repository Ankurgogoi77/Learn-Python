name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # Change this if needed

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Ensure this file exists

      - name: Run Tests with Coverage
        run: |
          pytest --cov=. --cov-report=xml  # Generates coverage.xml

      - name: Run SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.organization=your-sonarcloud-org \
            -Dsonar.projectKey=your-repo-name \
            -Dsonar.python.version=3 \
            -Dsonar.sources=. \
            -Dsonar.coverageReportPaths=coverage.xml \
            -Dsonar.host.url=https://sonarcloud.io 
